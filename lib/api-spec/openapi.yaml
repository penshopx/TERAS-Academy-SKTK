      type: object
      required: [schemaVersion, exportedAt, filters, recordCount, records, integrity]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        exportedAt: { type: string, format: date-time }
        filters:
          type: object
          required: [learnerId, pathwayId, status, ruleVersion]
          properties:
            learnerId: { type: ["string", "null"] }
            pathwayId: { type: ["string", "null"] }
            status: { type: ["string", "null"], enum: [Not Ready, Developing, Ready for Official Assessment, null] }
            ruleVersion: { type: ["integer", "null"], minimum: 1 }
        recordCount: { type: integer, minimum: 0 }
        records: { type: array, items: { $ref: "#/components/schemas/AdminReadinessEvaluation" } }
        integrity:
          type: object
          required: [algorithm, canonicalization, checksum, signature, verificationCommand]
          properties:
            algorithm: { type: string, enum: [SHA-256] }
            canonicalization:
              type: string
              description: JSON.stringify of schemaVersion, exportedAt, filters, recordCount, and records in that order
              enum: [teras-readiness-export-v1-json-stringify]
            checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
            signature:
              type: object
              required: [algorithm, keyId, keyVersion, value, publicKeyUrl]
              properties:
                algorithm: { type: string, enum: [Ed25519] }
                keyId: { type: string, minLength: 1 }
                keyVersion: { type: integer, minimum: 1 }
                value: { type: string, contentEncoding: base64 }
