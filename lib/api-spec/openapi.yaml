  parameters:
    PersonId: { name: personId, in: path, required: true, schema: { type: string } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, minLength: 1 } }
    PathwayId: { name: pathwayId, in: path, required: true, schema: { type: string } }
    CohortId: { name: cohortId, in: path, required: true, schema: { type: string } }
    EnrollmentId: { name: enrollmentId, in: path, required: true, schema: { type: string } }
    CourseId: { name: courseId, in: path, required: true, schema: { type: string } }
    BaselineId: { name: baselineId, in: path, required: true, schema: { type: string, minLength: 1 } }
    BaselineVersionId: { name: versionId, in: path, required: true, schema: { type: string, minLength: 1 } }
    ResourceId: { name: resourceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
    DiagnosticSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RemediationId:
      name: remediationId
      in: path
      required: true
      schema:
        type: string
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
    PracticeAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
  responses:
    Conflict:
      description: A lifecycle or uniqueness conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user cannot perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CausalReferences:
      type: object
      additionalProperties:
        type: array
        items: { type: string }
    DiagnosticSessionInput:
      type: object
      properties: {}
    DiagnosticResponseInput:
      type: object
      required: [questionId, optionId]
      properties:
        questionId: { type: string }
        optionId: { type: string }
    DiagnosticResponsesInput:
      type: object
      required: [responses, progress]
      properties:
        responses:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticResponseInput" }
        progress: { type: integer, minimum: 0, maximum: 100 }
    DiagnosticOption:
      type: object
      required: [id, code, label, score]
      properties:
        id: { type: string }
        code: { type: string }
        label: { type: string }
        score: { type: integer }
        safetyOutcome: { type: ["string", "null"] }
    DiagnosticTemplate:
      type: object
      required: [id, frameworkId, pathwayId, version, name, description, status, dimensions]
      properties:
        id: { type: string }
        frameworkId: { type: string }
        pathwayId: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        dimensions: { type: array, items: { type: string } }
    DiagnosticResponse:
      type: object
      required: [questionId, optionId]
      properties:
        questionId: { type: string }
        optionId: { type: string }
    DiagnosticQuestion:
      type: object
      required: [id, dimension, questionType, prompt, explanation, difficulty, sequence, required, competencyUnitId, options]
      properties:
        id: { type: string }
        dimension: { type: string }
        questionType: { type: string, enum: [single_choice, rating, experience, evidence, scenario] }
        prompt: { type: string }
        explanation: { type: ["string", "null"] }
        difficulty: { type: string }
        sequence: { type: integer }
        required: { type: boolean }
        competencyUnitId: { type: ["string", "null"] }
        options: { type: array, items: { $ref: "#/components/schemas/DiagnosticOption" } }
    DiagnosticSession:
      type: object
      required: [id, status, progress, pathwayId, templateId]
      properties:
        id: { type: string }
        status: { type: string }
        progress: { type: integer }
        pathwayId: { type: string }
        templateId: { type: string }
        completedAt: { type: ["string", "null"], format: date-time }
    Diagnostic:
      type: object
      required: [template, session, questions]
      properties:
        template: { $ref: "#/components/schemas/DiagnosticTemplate" }
        session: { anyOf: [{ $ref: "#/components/schemas/DiagnosticSession" }, { type: "null" }] }
        questions: { type: array, items: { $ref: "#/components/schemas/DiagnosticQuestion" } }
        responses: { type: array, items: { $ref: "#/components/schemas/DiagnosticResponse" } }
    CompetencyProfileItem:
      type: object
      required: [competencyUnitId, unitCode, unitTitle, state, score, evidenceLevel, provenance]
      properties:
        competencyUnitId: { type: string }
        unitCode: { type: string }
        unitTitle: { type: string }
        state: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        evidenceLevel: { type: string }
        provenance:
          anyOf:
            - $ref: "#/components/schemas/DiagnosticProvenance"
            - type: "null"
    DiagnosticGap:
      type: object
      required: [id, competencyUnitId, diagnosis, severity, provenance]
      properties:
        id: { type: string }
        competencyUnitId: { type: string }
        unitCode: { type: string }
        unitTitle: { type: string }
        diagnosis: { type: string }
        severity: { type: string }
        provenance:
          anyOf:
            - $ref: "#/components/schemas/DiagnosticProvenance"
            - type: "null"
    DiagnosticProvenance:
      type: object
      required: [sessionId, responseIds, questionIds, optionIds]
      properties:
        sessionId: { type: string, minLength: 1 }
        responseIds: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        questionIds: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        optionIds: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    DiagnosticRecommendation:
      type: object
      required: [id, competencyUnitId, kind, title, rationale, priority, href]
      properties:
        id: { type: string }
        competencyUnitId: { type: ["string", "null"] }
        unitCode: { type: string }
        unitTitle: { type: string }
        kind: { type: string }
        title: { type: string }
        rationale: { type: string }
        priority: { type: string }
        href: { type: ["string", "null"] }
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticRecommendationFollowUp"
        followUpReminder:
          $ref: "#/components/schemas/DiagnosticRecommendationFollowUpReminder"
    DiagnosticRecommendationFollowUpReminder:
      type: object
      required: [status, timing]
      properties:
        status:
          type: ["string", "null"]
          enum: [planned, in_progress, completed, null]
        timing:
          type: string
          enum: [unscheduled, scheduled, due_soon, overdue, completed]
    DiagnosticRecommendationFollowUp:
      type: object
      required: [id, recommendationId, trainerId, trainerName, status, targetAt, note, recordedAt]
      properties:
        id: { type: string }
        recommendationId: { type: string }
        trainerId: { type: string }
        trainerName: { type: string }
        status: { type: string, enum: [planned, in_progress, completed] }
        targetAt: { type: ["string", "null"], format: date-time }
        note: { type: string }
        recordedAt: { type: string, format: date-time }
    DiagnosticRecommendationFollowUpInput:
      type: object
      required: [idempotencyKey, status, note]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [planned, in_progress, completed] }
        targetAt: { type: ["string", "null"], format: date-time }
        note: { type: string, minLength: 1, maxLength: 500 }
    TrainerReminderPreferences:
      type: object
      required: [emailEnabled, timeZone, quietHoursStart, quietHoursEnd, deliveryStatus, nextDeliveryAt, updatedAt]
      properties:
        emailEnabled: { type: boolean }
        timeZone: { type: string }
        quietHoursStart: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        quietHoursEnd: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        deliveryStatus: { type: string, enum: [active, paused_quiet_hours, disabled] }
        nextDeliveryAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
    TrainerReminderPreferencesInput:
      type: object
      required: [emailEnabled, timeZone, quietHoursStart, quietHoursEnd, confirmFullDayQuietHours]
      properties:
        emailEnabled: { type: boolean }
        timeZone: { type: string, minLength: 1, maxLength: 100 }
        quietHoursStart: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        quietHoursEnd: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        confirmFullDayQuietHours:
          type: boolean
          description: Must be true when quiet-hours start and end are equal, confirming that reminders will be paused for the full 24 hours.
    TrainerReminderPreferenceRevision:
      type: object
      required: [id, emailEnabled, timeZone, quietHoursStart, quietHoursEnd, recordedAt]
      properties:
        id: { type: string }
        emailEnabled: { type: boolean }
        timeZone: { type: string }
        quietHoursStart: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        quietHoursEnd: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        recordedAt: { type: string, format: date-time }
    TrainerDiagnosticFollowUp:
      type: object
      required: [learnerId, learnerName, pathwayId, pathwayName, baselineScore, currentState, completedAt, dimensionSummaries, gaps, recommendations, safetyFindings]
      properties:
        learnerId: { type: string }
        learnerName: { type: string }
        pathwayId: { type: string }
        pathwayName: { type: string }
        baselineScore: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        currentState: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"], format: date-time }
        dimensionSummaries: { type: object, additionalProperties: { type: number } }
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticGap"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticRecommendation"
        safetyFindings:
          type: array
          items:
            $ref: "#/components/schemas/TrainerDiagnosticSafetyFinding"
    TrainerDiagnosticSafetyFinding:
      type: object
      required: [id, competencyUnitId, code, severity, blocking, detail]
      properties:
        id: { type: string }
        competencyUnitId: { type: ["string", "null"] }
        code: { type: string }
        severity: { type: string }
        blocking: { type: boolean }
        detail: { type: string }
    CompetencyProfile:
      type: object
      required: [id, frameworkId, frameworkVersion, pathwayId, currentState, safetyOverride, dimensionSummaries, provenance, items, gaps, recommendations]
      properties:
        id: { type: string }
        frameworkId: { type: string }
        frameworkVersion: { type: string }
        pathwayId: { type: string }
        currentState: { type: string }
        safetyOverride: { type: boolean }
        dimensionSummaries: { type: object, additionalProperties: { type: number } }
        provenance:
          anyOf:
            - $ref: "#/components/schemas/DiagnosticProvenance"
            - type: "null"
        items: { type: array, items: { $ref: "#/components/schemas/CompetencyProfileItem" } }
        gaps: { type: array, items: { $ref: "#/components/schemas/DiagnosticGap" } }
        recommendations: { type: array, items: { $ref: "#/components/schemas/DiagnosticRecommendation" } }
    ReadinessMap:
      type: object
      required: [profile, readiness]
      properties:
        profile: { $ref: "#/components/schemas/CompetencyProfile" }
        readiness: { $ref: "#/components/schemas/ReadinessSummary" }
    CompetencyFrameworkInput:
      type: object
      required: [id, code, name, description, domain, version, status]
      properties:
        id: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description: { type: string }
        domain: { type: string }
        version: { type: string }
        status: { type: string, enum: [draft, active, archived] }
    CompetencyFrameworkUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        domain: { type: string }
        version: { type: string }
        status: { type: string, enum: [draft, active, archived] }
    AdminCompetencyFramework:
      allOf:
        - $ref: "#/components/schemas/CompetencyFrameworkInput"
        - type: object
          required: [createdAt, updatedAt, units]
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            units:
              type: array
              items: { $ref: "#/components/schemas/AdminCompetencyUnit" }
    CompetencyUnitInput:
      type: object
      required: [id, frameworkId, code, title, description, status, sequence]
      properties:
        id: { type: string, minLength: 1 }
        frameworkId: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        sequence: { type: integer, minimum: 1 }
        pathwayIds: { type: array, items: { type: string, minLength: 1 } }
        outcomeMappings: { type: array, items: { $ref: "#/components/schemas/CompetencyOutcomeMapping" } }
        practiceTaskIds: { type: array, items: { type: string, minLength: 1 } }
        evidenceRequirementIds: { type: array, items: { type: string, minLength: 1 } }
        simulations: { type: array, items: { $ref: "#/components/schemas/CompetencySimulation" } }
        safetyRules: { type: array, items: { $ref: "#/components/schemas/CompetencySafetyRule" } }
    CompetencyUnitUpdate:
      type: object
      properties:
        frameworkId: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        status: { type: string, enum: [draft, active, archived] }
        sequence: { type: integer, minimum: 1 }
        pathwayIds: { type: array, items: { type: string, minLength: 1 } }
        outcomeMappings: { type: array, items: { $ref: "#/components/schemas/CompetencyOutcomeMapping" } }
        practiceTaskIds: { type: array, items: { type: string, minLength: 1 } }
        evidenceRequirementIds: { type: array, items: { type: string, minLength: 1 } }
        simulations: { type: array, items: { $ref: "#/components/schemas/CompetencySimulation" } }
        safetyRules: { type: array, items: { $ref: "#/components/schemas/CompetencySafetyRule" } }
    AdminCompetencyUnit:
      allOf:
        - $ref: "#/components/schemas/CompetencyUnitInput"
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CompetencyOutcomeMapping:
      type: object
      additionalProperties: false
      required: [outcomeCode, description, verificationMethod]
      properties:
        learningOutcomeId: { type: ["string", "null"], minLength: 1 }
        outcomeCode: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        verificationMethod: { type: string, enum: [TRAINER_REVIEW, SELF_CHECK, OBSERVATION, EVIDENCE_REVIEW, ASSESSMENT] }
    CompetencySimulation:
      type: object
      additionalProperties: false
      required: [title, instructions, evidenceRequired, durationMinutes]
      properties:
        title: { type: string, minLength: 1 }
        instructions: { type: string, minLength: 1 }
        evidenceRequired: { type: string, minLength: 1 }
        durationMinutes: { type: integer, minimum: 0 }
    CompetencySafetyRule:
      type: object
      additionalProperties: false
      required: [code, rule, severity, verificationEvidence, blocking]
      properties:
        code: { type: string, minLength: 1 }
        rule: { type: string, minLength: 1 }
        severity: { type: string, enum: [critical, high, medium, low] }
        verificationEvidence: { type: string, minLength: 1 }
        blocking: { type: boolean }
    AdminAccess:
      type: object
      required: [authorized]
      properties:
        authorized:
          type: boolean
          const: true
    LearningState:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, LEARNING_COMPLETED, OUTCOME_VERIFIED, PRACTICE_REQUIRED, PRACTICE_IN_PROGRESS, EVIDENCE_SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED, REMEDIATION, REASSESSMENT, READY, NOT_READY]
    CourseAuthoringEntity:
      type: string
      enum: [COURSE, COURSE_MODULE, LESSON, ACTIVITY, OUTCOME, RESOURCE]
    ManagedResourceUploadRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 180, pattern: "^[^/\\\\]+$" }
        size: { type: integer, minimum: 1, maximum: 104857600 }
        contentType:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/msword, image/jpeg, image/png, image/webp, video/mp4, video/webm]
      required: [name, size, contentType]
    ManagedResourceUploadResponse:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string, pattern: "^/objects/uploads/" }
        metadata: { $ref: "#/components/schemas/ManagedResourceUploadRequest" }
      required: [uploadURL, objectPath, metadata]
    CourseAuthoringAction:
      type: string
      enum: [CREATE, UPDATE, REORDER, DUPLICATE, ARCHIVE]
    CourseAuthoringCommand:
      type: object
      additionalProperties: false
      properties:
        action: { $ref: "#/components/schemas/CourseAuthoringAction" }
        entity: { $ref: "#/components/schemas/CourseAuthoringEntity" }
        id: { type: string, minLength: 1 }
        courseId: { type: string, minLength: 1 }
        data: { type: object, additionalProperties: true }
      required: [action, entity, courseId]
    CourseAuthoringCommandResult:
      type: object
      properties:
        id: { type: string }
        entity: { $ref: "#/components/schemas/CourseAuthoringEntity" }
        action: { $ref: "#/components/schemas/CourseAuthoringAction" }
        status: { type: string }
      required: [id, entity, action, status]
    CourseValidationIssue:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        entityId: { type: ["string", "null"] }
      required: [code, message, entityId]
    CourseValidationReport:
      type: object
      properties:
        courseId: { type: string }
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/CourseValidationIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/CourseValidationIssue" } }
      required: [courseId, valid, errors, warnings]
    CourseAuthoringPreview:
      type: object
      properties:
        course: { $ref: "#/components/schemas/LearningCourse" }
        validation: { $ref: "#/components/schemas/CourseValidationReport" }
      required: [course, validation]
    CourseVersion:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        version: { type: integer }
        authoringRevision: { type: integer, minimum: 0 }
        lifecycle: { type: string, enum: [PUBLISHED] }
        publishedAt: { type: string, format: date-time }
      required: [id, courseId, version, authoringRevision, lifecycle, publishedAt]
    CourseAuthoringAuditEvent:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        versionId: { type: ["string", "null"] }
        action: { type: string }
        actorId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, courseId, versionId, action, actorId, details, createdAt]
    BaselineDraft:
      type: object
      properties:
        baselineId: { type: string }
        versionId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT] }
        sourceVersion: { type: integer }
      required: [baselineId, versionId, version, status, sourceVersion]
    BaselinePublishedVersion:
      type: object
      properties:
        baselineId: { type: string }
        versionId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [PUBLISHED] }
        publishedAt: { type: string, format: date-time }
      required: [baselineId, versionId, version, status, publishedAt]
    BaselineDraftInput:
      type: object
      additionalProperties: false
      properties:
        snapshot: { type: object, additionalProperties: true }
      required: [snapshot]
    BaselineValidationIssue:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: string }
      required: [code, message, path]
    BaselineValidationReport:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/BaselineValidationIssue" } }
      required: [valid, errors]
    BaselineDraftUpdated:
      type: object
      properties:
        baselineId: { type: string }
        versionId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT] }
        snapshot: { type: object, additionalProperties: true }
      required: [baselineId, versionId, version, status, snapshot]
    BaselineVersion:
      type: object
      properties:
        id: { type: string }
        baselineId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        snapshot: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        publishedAt: { type: ["string", "null"], format: date-time }
        publishedBy: { type: ["string", "null"] }
      required: [id, baselineId, version, status, snapshot, createdAt, createdBy, publishedAt, publishedBy]
    BaselineAuditEvent:
      type: object
      properties:
        id: { type: string }
        baselineId: { type: string }
        versionId: { type: ["string", "null"] }
        action: { type: string }
        actorId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, baselineId, versionId, action, actorId, details, createdAt]
    LearningActivityType:
      type: string
      enum: [READING, VIDEO, AUDIO, INTERACTIVE, QUIZ, ASSIGNMENT, DISCUSSION, LIVE_SESSION, WORKSHOP, REFLECTION, PRACTICE_PREPARATION]
    LearningResource:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [PDF, VIDEO, AUDIO, DOCUMENT, LINK, IMAGE, TEXT] }
        title: { type: string }
        uri: { type: ["string", "null"] }
        objectPath:
          type: ["string", "null"]
          pattern: "^/objects/"
          description: Managed App Storage object path. File bytes and base64 are never accepted.
        mimeType: { type: ["string", "null"] }
        content: { type: ["string", "null"] }
        sequence: { type: integer }
      required: [id, type, title, uri, objectPath, mimeType, content, sequence]
    LearningResourceInput:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        activityId: { type: string, minLength: 1 }
        type: { type: string, enum: [PDF, VIDEO, AUDIO, DOCUMENT, LINK, IMAGE, TEXT] }
        title: { type: string, minLength: 1 }
        uri:
          type: ["string", "null"]
          format: uri
          pattern: "^https?://"
          description: Absolute external address using the http or https protocol.
        objectPath:
          type: ["string", "null"]
          pattern: "^/objects/"
          description: App Storage path returned by the presigned upload flow; never bytes or base64.
        mimeType: { type: ["string", "null"] }
        content: { type: ["string", "null"] }
        sequence: { type: integer, minimum: 1 }
      required: [id, activityId, type, title, sequence]
    LearningResourceProgressInput:
      type: object
      additionalProperties: false
