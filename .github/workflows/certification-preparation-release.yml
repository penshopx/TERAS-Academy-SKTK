name: Certification preparation release gate

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create after Gate Review GO
        required: true
        type: string
      target_ref:
        description: Commit SHA or branch to test and release
        required: true
        default: main
        type: string
      release_name:
        description: Optional release title (defaults to the tag)
        required: false
        type: string
      prerelease:
        description: Create as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: write
  deployments: write
  id-token: write

concurrency:
  group: certification-preparation-release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  POSTGRES_CURRENT_MAJOR: "17"
  POSTGRES_TARGET_MAJOR: "18"

jobs:
  resolve-release-candidate:
    name: Lock release candidate SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      postgres_current_major: ${{ steps.postgres-upgrade.outputs.current_major }}
      postgres_target_major: ${{ steps.postgres-upgrade.outputs.target_major }}
      postgres_upgrade_matrix: ${{ steps.postgres-upgrade.outputs.matrix }}
    steps:
      - name: Resolve release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Lock release candidate SHA
        id: candidate
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate PostgreSQL upgrade pair
        id: postgres-upgrade
        run: |
          set -euo pipefail
          current_major="${POSTGRES_CURRENT_MAJOR:-}"
          target_major="${POSTGRES_TARGET_MAJOR:-}"
          if [[ -z "$current_major" || -z "$target_major" ]]; then
            echo "::error::PostgreSQL upgrade pair is incomplete: both POSTGRES_CURRENT_MAJOR and POSTGRES_TARGET_MAJOR are required."
            exit 1
          fi
          if [[ ! "$current_major" =~ ^[0-9]+$ || ! "$target_major" =~ ^[0-9]+$ ]]; then
            echo "::error::PostgreSQL upgrade pair must contain numeric major versions: current=${current_major}, target=${target_major}."
            exit 1
          fi
          if [[ "$current_major" == "$target_major" ]]; then
            echo "::error::PostgreSQL upgrade pair must use different major versions: current=${current_major}, target=${target_major}."
            exit 1
          fi
          echo "current_major=$current_major" >> "$GITHUB_OUTPUT"
          echo "target_major=$target_major" >> "$GITHUB_OUTPUT"
          echo "matrix=[\"$current_major\",\"$target_major\"]" >> "$GITHUB_OUTPUT"

  migration-collation-upgrade:
    name: Rehearse migration winners (PostgreSQL ${{ matrix.postgres }}, ${{ matrix.collation.name }})
    needs: resolve-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.resolve-release-candidate.outputs.postgres_upgrade_matrix) }}
        collation:
          - name: libc-C
            initdb_args: --locale-provider=libc --locale=C
          - name: icu-en-US
            initdb_args: --locale-provider=icu --icu-locale=en-US
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: ${{ matrix.collation.initdb_args }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-candidate.outputs.sha }}

      - name: Run deterministic migration upgrade fixture
        env:
          TERAS_COLLATION_RESULT_FILE: migration-collation-results/${{ matrix.postgres }}-${{ matrix.collation.name }}.tsv
        run: bash scripts/migration-collation.integration.test.sh

      - name: Upload migration winner rehearsal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-collation-${{ matrix.postgres }}-${{ matrix.collation.name }}
          path: migration-collation-results/${{ matrix.postgres }}-${{ matrix.collation.name }}.tsv
          if-no-files-found: error

  compare-migration-collation-upgrade:
    name: Compare PostgreSQL ${{ needs.resolve-release-candidate.outputs.postgres_current_major }} and ${{ needs.resolve-release-candidate.outputs.postgres_target_major }} migration winners
    needs:
      - resolve-release-candidate
      - migration-collation-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_CURRENT_MAJOR: ${{ needs.resolve-release-candidate.outputs.postgres_current_major }}
      POSTGRES_TARGET_MAJOR: ${{ needs.resolve-release-candidate.outputs.postgres_target_major }}
    steps:
      - name: Download migration winner rehearsals
        uses: actions/download-artifact@v4
        with:
          pattern: migration-collation-*
          path: migration-collation-results
          merge-multiple: true

      - name: Require identical winners across PostgreSQL major versions
        run: |
          set -euo pipefail
          for collation in libc-C icu-en-US; do
            current_file="migration-collation-results/${POSTGRES_CURRENT_MAJOR}-${collation}.tsv"
            target_file="migration-collation-results/${POSTGRES_TARGET_MAJOR}-${collation}.tsv"
            IFS=$'\t' read -r current_version current_provider current_locale current_winners < "$current_file"
            IFS=$'\t' read -r target_version target_provider target_locale target_winners < "$target_file"
            if [[ "$current_winners" != "$target_winners" ]]; then
              echo "::error::Migration winners changed across PostgreSQL major versions: PostgreSQL ${current_version} provider=${current_provider} locale=${current_locale} winners=${current_winners}; PostgreSQL ${target_version} provider=${target_provider} locale=${target_locale} winners=${target_winners}."
              exit 1
            fi
            echo "Migration winners match: PostgreSQL ${current_version} and ${target_version}, provider=${current_provider}/${target_provider}, locale=${current_locale}/${target_locale}, winners=${current_winners}"
          done

  verify-api-contract:
    name: Verify generated API contract and API Server types
    needs: resolve-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-candidate.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI outputs
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Reject uncommitted generated API drift
        run: git diff --exit-code -- lib/api-zod/src/generated lib/api-client-react/src/generated

      - name: Typecheck API Server
        run: pnpm --filter @workspace/api-server run typecheck

  verify-approval-control:
    name: Verify required human reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require protected Gate Review environment
        uses: actions/github-script@v7
        with:
          script: |
            const environment = await github.rest.repos.getEnvironment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment_name: "release-gate-review",
            });
            const reviewerRule = environment.data.protection_rules?.find(
              (rule) =>
                rule.type === "required_reviewers" &&
                Array.isArray(rule.reviewers) &&
                rule.reviewers.length > 0,
            );
            if (!reviewerRule) {
              core.setFailed(
                "The release-gate-review environment must have at least one required reviewer.",
              );
            }

  certification-preparation-evidence:
    name: Produce certification-preparation evidence
    needs:
      - resolve-release-candidate
      - verify-approval-control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_sha: ${{ needs.resolve-release-candidate.outputs.sha }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TERAS_GATE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TERAS_GATE_REPORT_DIR: ${{ github.workspace }}/release-gate-reports
      TERAS_GATE_STORAGE_ADAPTER: test
      TERAS_GATE_STORAGE_NAMESPACE: release-gate/${{ github.run_id }}/${{ github.run_attempt }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-candidate.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for admin access gate
        run: pnpm run setup:browser-admin-access

      - name: Verify diagnostic provenance upgrade
        run: |
          pnpm --filter @workspace/scripts run test:diagnostic-provenance
          pnpm --filter @workspace/scripts run test:diagnostic-provenance-upgrade

      - name: Run certification-preparation release gate
        env:
          TERAS_GATE_CANDIDATE_SHA: ${{ needs.resolve-release-candidate.outputs.sha }}
        run: pnpm run gate:certification-preparation

      - name: Attest release-gate evidence
        if: always() && needs.resolve-release-candidate.outputs.sha != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-gate-reports/*.json
            release-gate-reports/*.md

      - name: Upload PASS or FAIL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-gate-reports/
          if-no-files-found: error
          retention-days: 30

  verify-release-evidence:
    name: Verify evidence belongs to release candidate
    needs: certification-preparation-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ needs.certification-preparation-evidence.outputs.candidate_sha }}
    steps:
      - name: Check out release evidence verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download release-gate evidence
        uses: actions/download-artifact@v4
        with:
          name: certification-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-gate-reports

      - name: Verify provenance, PASS status, and candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find release-gate-reports -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' \) -print | sort)
          [[ "${#reports[@]}" -eq 2 ]] &&
            [[ "$(find release-gate-reports -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1 ]] &&
            [[ "$(find release-gate-reports -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 1 ]] || {
            echo "::error::Expected exactly one JSON and one Markdown evidence report."
            exit 1
          }
          for report in "${reports[@]}"; do
            gh attestation verify "$report" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/certification-preparation-release.yml"
          done
          json_report="$(find release-gate-reports -maxdepth 1 -type f -name '*.json' -print -quit)"
          markdown_report="$(find release-gate-reports -maxdepth 1 -type f -name '*.md' -print -quit)"
          bash scripts/verify-certification-preparation-evidence.sh "$json_report" "$TARGET_SHA"
          expected_markdown_line="$(printf -- '- Release candidate SHA: `%s`' "$TARGET_SHA")"
          grep -Fqx -- "$expected_markdown_line" "$markdown_report" || {
            echo "::error::Markdown evidence does not identify release candidate $TARGET_SHA."
            exit 1
          }

  gate-review:
    name: Gate Review GO/NO-GO
    needs:
      - certification-preparation-evidence
      - compare-migration-collation-upgrade
      - verify-api-contract
      - verify-release-evidence
    runs-on: ubuntu-latest
    environment: release-gate-review
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
      TARGET_SHA: ${{ needs.certification-preparation-evidence.outputs.candidate_sha }}
    steps:
      - name: Record manual GO for verified candidate
        run: echo "Gate Review GO recorded for ${RELEASE_TAG} at ${TARGET_SHA}."

  publish-release:
    name: Publish approved release
    needs:
      - certification-preparation-evidence
      - gate-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag_name }}
      RELEASE_NAME: ${{ inputs.release_name || inputs.tag_name }}
      TARGET_SHA: ${{ needs.certification-preparation-evidence.outputs.candidate_sha }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Check out release publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download approved release-gate evidence
        uses: actions/download-artifact@v4
        with:
          name: certification-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-gate-reports

      - name: Reverify approved evidence before publishing
        run: |
          set -euo pipefail
          mapfile -t reports < <(find release-gate-reports -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' \) -print | sort)
          [[ "${#reports[@]}" -eq 2 ]] &&
            [[ "$(find release-gate-reports -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1 ]] &&
            [[ "$(find release-gate-reports -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 1 ]] || {
            echo "::error::Expected exactly one JSON and one Markdown evidence report."
            exit 1
          }
          for report in "${reports[@]}"; do
            gh attestation verify "$report" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/certification-preparation-release.yml"
          done
          json_report="$(find release-gate-reports -maxdepth 1 -type f -name '*.json' -print -quit)"
          markdown_report="$(find release-gate-reports -maxdepth 1 -type f -name '*.md' -print -quit)"
          bash scripts/verify-certification-preparation-evidence.sh "$json_report" "$TARGET_SHA"
          expected_markdown_line="$(printf -- '- Release candidate SHA: `%s`' "$TARGET_SHA")"
          grep -Fqx -- "$expected_markdown_line" "$markdown_report" || {
            echo "::error::Approved Markdown evidence does not belong to release candidate $TARGET_SHA."
            exit 1
          }

      - name: Create locked tag and release
        run: bash scripts/publish-approved-release.sh
